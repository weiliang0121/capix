name: Publish packages

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full main commit SHA reviewed for this release
        required: true
        type: string

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      npm_config_registry: https://registry.npmjs.org
      NPM_CONFIG_PROVENANCE: 'false'
    steps:
      - name: Verify reviewed commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@11.6.2 --registry=https://registry.npmjs.org
          echo "npm_config_npm_path=$(command -v npm)" >> "$GITHUB_ENV"
          npm --version
      - run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - run: pnpm check
      - name: Publish reviewed package versions using OIDC
        run: pnpm release:publish
