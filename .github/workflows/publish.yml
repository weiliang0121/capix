name: Publish release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_pr:
        description: Merged Changesets version PR number
        type: string
        required: true
permissions: {}

jobs:
  source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source: ${{ steps.resolve.outputs.source }}
      base: ${{ steps.resolve.outputs.base }}
      artifact: ${{ steps.resolve.outputs.artifact }}
      eligible: ${{ steps.resolve.outputs.eligible }}
      pr: ${{ steps.resolve.outputs.pr }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - id: resolve
        env:
          VERSION_PR: ${{ inputs.version_pr }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/source.mjs

  prepare:
    needs: source
    if: needs.source.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.source.outputs.source }}
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - run: pnpm check
      - run: pnpm release:check
      - run: pnpm integration:check
      - name: Assemble verified batch
        env:
          BASE: ${{ needs.source.outputs.base }}
          SOURCE: ${{ needs.source.outputs.source }}
          PR: ${{ needs.source.outputs.pr }}
        run: |
          node scripts/release/batch.mjs "$BASE" "$SOURCE" "$PR" .capix/release
          mkdir release-artifact
          cd .capix/release
          printf '\n[Commit checks](%s/%s/commit/%s/checks)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$SOURCE" >> release-notes.md
          cp release-manifest.json release-notes.md ../../release-artifact
          jq -r '.packages[].file' release-manifest.json | while IFS= read -r file; do cp -- "$file" ../../release-artifact/; done
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
          echo "Preparation run ID: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.source.outputs.artifact }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [source, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    concurrency:
      group: capix-npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.source.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org npm@11.11.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.source.outputs.artifact }}
          path: release-artifact
      - name: Publish prepared tarballs
        env:
          VERSION_PR: ${{ needs.source.outputs.pr }}
          SOURCE_SHA: ${{ needs.source.outputs.source }}
        run: |
          jq -e --arg sha "$SOURCE_SHA" --arg pr "$VERSION_PR" '.source == $sha and (.pullRequest | tostring) == $pr' release-artifact/release-manifest.json
          node scripts/release/publish-batch.mjs publish release-artifact

  announce:
    needs: [source, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: capix-release-pr-${{ needs.source.outputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.source.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.source.outputs.artifact }}
          path: release-artifact
      - name: Confirm registry and publish release notes
        env:
          SOURCE_SHA: ${{ needs.source.outputs.source }}
          VERSION_PR: ${{ needs.source.outputs.pr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -e --arg sha "$SOURCE_SHA" --arg pr "$VERSION_PR" '.source == $sha and (.pullRequest | tostring) == $pr' release-artifact/release-manifest.json
          node scripts/release/publish-batch.mjs verify release-artifact
          node scripts/release/github-release.mjs release-artifact
