name: Version packages

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: version-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: Read release plan
        id: plan
        run: |
          pnpm exec changeset status --output "$RUNNER_TEMP/capix-release-plan.json"
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const plan = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/capix-release-plan.json`, 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, `has_releases=${plan.releases.length > 0}\n`);
          JS
      - name: Create version pull request
        if: steps.plan.outputs.has_releases == 'true'
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2, Changesets v3
        with:
          script: pnpm release:version
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
